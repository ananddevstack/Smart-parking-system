<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>Sample Table</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>1</td>
            <td>John Doe</td>
            <td>28</td>
            <td>New York</td>
            <td>john@example.com</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Jane Smith</td>
            <td>34</td>
            <td>Los Angeles</td>
            <td>jane@example.com</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Michael Brown</td>
            <td>41</td>
            <td>Chicago</td>
            <td>michael@example.com</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Emily Davis</td>
            <td>26</td>
            <td>Houston</td>
            <td>emily@example.com</td>
        </tr>
    </table>
</body>
</html>
